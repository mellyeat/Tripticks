<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicia sesion en TripTicks para gestionar tus reservaciones de viaje." />
  <title>Iniciar sesion - TripTicks</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;700&display=swap" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

  <link rel="stylesheet" href="../css/output.css" />
</head>

<body class="bg-off-white text-on-background font-body-md text-body-md antialiased">
  <main class="min-h-screen flex flex-col md:flex-row">

    <!-- Panel decorativo: se oculta en movil para dejar la pantalla al formulario -->
    <section class="hidden md:flex md:w-1/2 relative items-end p-12"
             aria-hidden="true">
      <div class="absolute inset-0 bg-cover bg-center"
           style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDEQ474PA4SXUWaLW4qtXmL8PGgBFLmexoVYLJKIApcmT1j2oG-A8r_mlOtbSh3wfIYQLeytKzmIaXRk_UWHFeWYrErZKMe1ByVl5huX9yc67FRkG0aLMRSNen0QjVxcGu1TyUt8skuRrURsR1NM_HmyCJKeUU6h9GtyhMJEn2KXGN72ZyVZauukGzQ-Ruxgwyz0DDWa7zDqttwd33xNKv66KxuI1XiXbu146X2WcO8LF358jYJ3ymLPQ')"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/40 to-transparent"></div>

      <div class="relative z-10">
        <h2 class="font-display-lg text-display-lg text-white mb-4 drop-shadow-md">
          Tu proximo destino te espera.
        </h2>
        <p class="font-body-lg text-body-lg text-off-white/90 max-w-md">
          Accede a tu cuenta para consultar tus reservaciones y apartar tu lugar
          en las proximas salidas.
        </p>
      </div>
    </section>

    <section class="w-full md:w-1/2 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-12">
      <div class="w-full max-w-md mx-auto animate-fade-up">

        <a href="../index.html"
           class="font-display-lg text-display-lg-mobile text-deep-teal tracking-tight inline-block mb-8">
          TripTicks
        </a>

        <h1 class="font-headline-md text-headline-md text-primary mb-2">Iniciar sesion</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mb-8">
          Ingresa tus datos para continuar.
        </p>

        <!-- role=alert hace que el lector de pantalla anuncie el error al aparecer -->
        <div id="form-alert" class="alert-error hidden mb-6" role="alert"></div>

        <form id="login-form" novalidate class="space-y-6">
          <div>
            <label for="email" class="field-label">CORREO ELECTRONICO</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-warm-gray text-xl"
                    aria-hidden="true">mail</span>
              <input type="email" id="email" name="email" class="field field-icon"
                     placeholder="tucorreo@ejemplo.com" autocomplete="email" required />
            </div>
            <p class="font-body-sm text-body-sm text-error mt-2 hidden" data-error="email"></p>
          </div>

          <div>
            <label for="password" class="field-label">CONTRASENA</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-warm-gray text-xl"
                    aria-hidden="true">lock</span>
              <input type="password" id="password" name="password" class="field field-icon pr-12"
                     placeholder="Tu contrasena" autocomplete="current-password" required />
              <button type="button" data-toggle-password="password"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-warm-gray hover:text-deep-teal p-1 rounded"
                      aria-label="Mostrar contrasena">
                <span class="material-symbols-outlined text-xl" aria-hidden="true">visibility</span>
              </button>
            </div>
            <p class="font-body-sm text-body-sm text-error mt-2 hidden" data-error="password"></p>
          </div>

          <button type="submit" class="btn-primary w-full">Entrar</button>
        </form>

        <p class="font-body-md text-body-md text-on-surface-variant mt-8 text-center">
          No tienes cuenta?
          <a href="register.html" class="text-deep-teal font-semibold hover:text-primary hover:underline">
            Crea una aqui
          </a>
        </p>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
